<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Dogfight — Lab 05: netcode</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: min(95vw, 95vh);
        height: min(95vw, 95vh);
        aspect-ratio: 1 / 1;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        border: 1px solid #222;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        font: 12px monospace;
        color: #00ff66;
        background: rgba(0, 0, 0, 0.65);
        padding: 4px 8px;
        border: 1px solid #00ff6633;
        pointer-events: none;
      }
      #lobby, #overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px;
        background: rgba(5, 5, 5, 0.92); color: #fff; font: 16px monospace;
      }
      #lobby[hidden], #overlay[hidden] { display: none; }
      #lobby ul { list-style: none; padding: 0; }
      #lobby li { margin: 6px 0; }
      #netgraph { position: absolute; right: 8px; top: 8px; font: 11px monospace; color: #9cf; background: rgba(0,0,0,.65); padding: 4px 8px; pointer-events: none; }
      #netgraph pre { margin: 0 0 4px; }
      #chat { position: absolute; left: 8px; bottom: 8px; width: 320px; font: 12px monospace; color: #fff; }
      #chat[hidden] { display: none; }
      #chat-log { max-height: 140px; overflow-y: auto; background: rgba(0,0,0,.6); padding: 4px; }
      #chat-log .sys { color: #888; }
      #chat-input { width: 100%; font: inherit; background: #111; color: #fff; border: 1px solid #333; }
      button { font: inherit; padding: 4px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="hud">Ініціалізація...</div>
      <canvas id="scene"></canvas>
      <div id="overlay" hidden></div>
      <div id="lobby" hidden></div>
      <div id="netgraph"></div>
      <div id="chat" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
