# Lab 6 CI: type-check first (cheap, catches what esbuild/Node strip away), then the tests, then a production build.
# NOTE: GitHub only runs workflows from the repository root. This project lives in a subdirectory of a larger
# coursework repo, so this file is inert there; it works as-is if `dogfight/` is ever its own repository.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
