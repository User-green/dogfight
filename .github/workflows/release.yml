# Tag-triggered delivery: v* -> build image -> push to GHCR -> deploy.
# UNTESTED: never run (this repo lives in a subdirectory of a larger repo, so GitHub does not execute it as-is).
# The deploy step is a placeholder: pick a platform (Fly.io / Render / Railway) and put its token in repository secrets.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}/dogfight:${{ github.ref_name }}
      # - name: Deploy
      #   run: flyctl deploy --image ghcr.io/${{ github.repository }}/dogfight:${{ github.ref_name }}
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
